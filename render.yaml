# Render Blueprint — deploys Coda from this repo in one click.
# Render.com -> New -> Blueprint -> pick this repo -> Deploy.
services:
  - type: web
    name: coda-play
    runtime: docker          # builds ./Dockerfile (python:3.12-slim + ffmpeg)
    plan: free
    region: sydney           # fresh datacenter IP (YouTube flags render IPs; change here if this one gets flagged)
    healthCheckPath: /api/health
